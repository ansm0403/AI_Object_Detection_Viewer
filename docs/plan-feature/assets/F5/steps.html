<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>F5 단계별 실제 화면</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #050506; color: #e4e4e7;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  .bar { position: sticky; top: 0; z-index: 5; background: #111113; border-bottom: 1px solid #27272a; padding: 10px 16px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .row + .row { margin-top: 8px; }
  .lbl { font-size: 12px; color: #71717a; width: 64px; }
  button { font: inherit; font-size: 13px; color: #d4d4d8; background: #1f1f23; border: 1px solid #3f3f46;
    border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: #71717a; }
  button.on { background: #064e3b; border-color: #34d399; color: #d1fae5; }
  button.mock.on { background: #0c4a6e; border-color: #38bdf8; color: #e0f2fe; }
  button:disabled { opacity: .3; cursor: default; }
  kbd { font: 600 11px ui-monospace, monospace; border: 1px solid #52525b; border-radius: 3px; padding: 0 4px; color: #a1a1aa; }
  code { font: 12px ui-monospace, monospace; color: #e4e4e7; background: #27272a; border-radius: 3px; padding: 0 4px; }
  .note { margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: #d4d4d8; max-width: 1150px; }
  .note b { color: #fff; }
  .hint { font-size: 12px; color: #71717a; margin-left: 10px; }
  .stage { padding: 16px; overflow-x: auto; }
  .tag { display: inline-block; margin-bottom: 8px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
  .tag.real { background: #064e3b; color: #a7f3d0; }
  .tag.mock { background: #0c4a6e; color: #bae6fd; }
  img { display: block; border: 1px solid #27272a; cursor: pointer; }
</style>
</head>
<body>
<div class="bar">
  <div class="row"><span class="lbl">화면</span><span id="shots"></span></div>
  <div class="row"><span class="lbl">창 크기</span><span id="sizes"></span>
    <button id="mock" class="mock">시안과 비교 <kbd>Space</kbd></button>
    <span class="hint">초록 = 실제 앱 캡처 · 파랑 = 구현 전 시안. 이미지를 클릭해도 바뀝니다. <kbd>←</kbd> <kbd>→</kbd> 로 화면을 넘깁니다. 이미지는 실제 크기(1:1)입니다.</span></div>
  <p class="note" id="note"></p>
</div>
<div class="stage">
  <span class="tag" id="tag"></span>
  <img id="img" alt="" />
</div>

  { step: 'D', name: 'D 놓침 선택', file: 'stepD_missed_zoom', sizes: ['1536x700', '1440x900', '1024x768'],
    mock: { '1536x700': 'A1_missed_zoom', '1024x768': 'A1_missed_zoom' },
    note: '<b>F5-D 실제 앱. 평가 모드의 완성 화면입니다</b>(놓친 오토바이 <code>599909</code> 선택). 이 단계에서 바뀐 곳은 <b>가운데 3D 뷰</b>입니다. 박스 색이 클래스 색에서 <b>결과 색</b>으로 바뀌었습니다: <b>초록 = 모델이 찾은 물체, 빨강 = 놓친 물체, 회색 = 평가하지 않은 박스</b>(앞 카메라 밖이거나 채점 제외). 왼쪽 위에 범례가 생겼습니다. 선택한 박스는 전처럼 흰색이고 이름표가 붙습니다. 볼 곳: 색이 있는 박스는 차 앞쪽(화면 가운데 위)의 한 무리뿐이고, 나머지 3분의 2는 회색입니다. 앞 카메라 한 대만 평가하기 때문입니다. 그 무리 안에서 빨간 박스가 어디에 몰려 있는지가 "놓친 물체가 3D 공간의 어디에 있었나"입니다. 마우스 휠로 가까이 가면 더 잘 보입니다. <code>Space</code>로 시안과 비교할 수 있습니다(1536, 1024). 1440×900에서는 패널의 클래스별 Recall과 안내 문구까지 한 번에 보입니다.' },
  { step: 'D', name: 'D 선택 없음', file: 'stepD_none_full', sizes: ['1536x700'],
    note: '<b>F5-D 실제 앱. 아무것도 선택하지 않은 평가 모드입니다.</b> 볼 곳: 3D 뷰의 초록 12개와 빨강 10개가 왼쪽 목록의 <code>Show</code> 칩(✓ 12, ✕ 10), 패널의 "Frame 6" 줄, 카메라 칸의 색과 같은 뜻으로 맞아떨어집니다(스크립트가 실제 three.js 장면에서 색별 박스 수를 세어 확인: 초록 12, 빨강 10, 회색 39, 합계 61). 헛짚음(노랑)은 3D에 없습니다. 모델 박스는 사진 위의 사각형이라 3D 위치가 없기 때문입니다.' },
  { step: 'D', name: 'D 점수 0.40', file: 'stepD_score040', sizes: ['1536x700'],
    note: '<b>F5-D 실제 앱. MIN SCORE를 0.40으로 올린 화면입니다.</b> 볼 곳: 3D 뷰의 초록이 줄고 빨강이 늘었습니다(이 프레임에서 찾음 12 → 8, 놓침 10 → 14). 슬라이더 하나에 상단 숫자, 목록, 카메라 칸, 3D 색, 타임라인 배지가 모두 함께 바뀝니다. 3D 시점은 그대로입니다(색만 바뀌고 장면을 다시 만들지 않음).' },
  { step: 'D', name: 'D 예측 없는 프레임', file: 'stepD_frame_without_predictions', sizes: ['1536x700'],
    note: '<b>F5-D 실제 앱. 예측 파일에 프레임 6만 빠져 있도록 일부러 만든 화면입니다.</b> "모델을 돌리지 않은 프레임"을 "하나도 못 찾은 프레임"과 구분하는지 봅니다. 볼 곳: 타임라인의 6번 배지가 "0 missed"가 아니라 <b>no preds</b>, 목록과 패널이 <b>"No predictions for this frame — not evaluated"</b>입니다. 3D와 카메라 칸은 색을 입히지 않고 평소 모습(클래스 색)으로 둡니다. 상단과 패널의 전체 숫자는 나머지 9개 프레임만으로 계산되고(패널에 "9 frames"), 패널 아래 안내에 "1 frame has no predictions…"가 나옵니다. 참고로 이 시험 파일에서는 7번 프레임을 "예측 0개"로 만들어 두었는데, 그쪽은 모델을 돌린 것이므로 22개가 전부 놓침으로 세어집니다(배지 22 missed).' },
  { step: 'D', name: 'D 잘못된 파일', file: 'stepD_wrong_file', sizes: ['1536x700'],
    note: '<b>F5-D 실제 앱. 예측 파일 자리에 형식이 다른 JSON이 온 경우입니다.</b> 볼 곳: 상단에 PREDICTIONS UNAVAILABLE, 패널에 "Not a predictions file: …", 목록에 "Predictions unavailable."이 나오고 앱은 멈추지 않습니다. 3D, 사진, 타임라인은 평소 모습입니다. 검수 모드는 이 파일과 상관없이 동작합니다.' },
];
// 처음 열면 가장 최근 단계의 첫 화면을 보여준다.
let shot = SHOTS.find((s) => s.step === SHOTS[SHOTS.length - 1].step), size = shot.sizes[0], showMock = false;
const $ = (id) => document.getElementById(id);
function render() {
  if (!shot.sizes.includes(size)) size = shot.sizes[0];
  const mockKey = shot.mock && shot.mock[size];
  if (!mockKey) showMock = false;
  $('shots').innerHTML = '';
  SHOTS.forEach((s, i) => {
    const b = document.createElement('button');
    b.innerHTML = i < 9 ? `${s.name} <kbd>${i + 1}</kbd>` : s.name; b.className = s === shot ? 'on' : '';
    b.onclick = () => { shot = s; showMock = false; render(); };
    $('shots').appendChild(b); $('shots').append(' ');
  });
  $('sizes').innerHTML = '';
  shot.sizes.forEach((sz) => {
    const b = document.createElement('button');
    b.textContent = sz.replace('x', '×'); b.className = sz === size ? 'on' : '';
    b.onclick = () => { size = sz; render(); };
    $('sizes').appendChild(b); $('sizes').append(' ');
  });
  $('mock').disabled = !mockKey;
  $('mock').className = 'mock' + (showMock ? ' on' : '');
  $('img').src = showMock ? `2026-11-25_mockup/${mockKey}_${size}.jpg` : `2026-11-25_steps/${shot.file}_${size}.jpg`;
  $('tag').textContent = showMock ? '구현 전 시안' : `실제 앱 · F5-${shot.step}`;
  $('tag').className = 'tag ' + (showMock ? 'mock' : 'real');
  $('note').innerHTML = shot.note;
}
const flip = () => { if (shot.mock && shot.mock[size]) { showMock = !showMock; render(); } };
$('mock').onclick = flip; $('img').onclick = flip;
addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); flip(); return; }
  // 화면이 9개를 넘으면 숫자키로 다 고를 수 없으므로 ← → 로도 넘긴다.
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const i = SHOTS.indexOf(shot) + (e.key === 'ArrowRight' ? 1 : -1);
    if (i >= 0 && i < SHOTS.length) { shot = SHOTS[i]; showMock = false; render(); }
    return;
  }
  const n = Number(e.key);
  if (n >= 1 && n <= SHOTS.length) { shot = SHOTS[n - 1]; showMock = false; render(); }
});
render();
</script>
