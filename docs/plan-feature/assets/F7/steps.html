let index = 0;
const nav = document.getElementById('nav');
const note = document.getElementById('note');
const view = document.getElementById('view');
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function render() {
  const s = SCREENS[index];
  nav.innerHTML = '';
  let lastStep = null;
  SCREENS.forEach((screen, i) => {
    if (screen.step !== lastStep) {
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = screen.step + ' ›';
      nav.appendChild(sep);
      lastStep = screen.step;
    }
    const b = document.createElement('button');
    b.textContent = screen.key;
    b.setAttribute('aria-pressed', String(i === index));
    b.onclick = () => { index = i; render(); };
    nav.appendChild(b);
  });
  note.innerHTML = '<h2>' + s.title + '</h2>' + s.html;
  let body = '';
  if (s.pre) {
    body += '<pre>' + s.pre.map(([kind, line]) => '<span class="' + kind + '">' + (kind === 'pass' ? 'PASS' : 'FAIL') + '</span>  ' + esc(line)).join('\n') + '\n\n' + esc(s.summary) + '</pre>';
  }
  if (s.img) body += '<div class="shot"><img' + (s.natural ? ' class="natural"' : '') + ' src="' + s.img + '" alt="" /></div>';
  view.innerHTML = body;
}
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { index = Math.min(SCREENS.length - 1, index + 1); render(); }
  if (e.key === 'ArrowLeft') { index = Math.max(0, index - 1); render(); }
});
render();
</script>
