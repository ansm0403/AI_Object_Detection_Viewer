<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>F7 시안 — 장면 탐색</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #09090b; color: #d4d4d8; font: 14px/1.6 system-ui, "Malgun Gothic", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: #18181b; border-bottom: 1px solid #27272a; padding: 10px 16px; }
  h1 { margin: 0 0 8px; font-size: 15px; color: #f4f4f5; }
  h1 small { font-weight: 400; color: #71717a; margin-left: 8px; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  nav button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 1px solid #3f3f46; background: #27272a; color: #d4d4d8; cursor: pointer; }
  nav button[aria-pressed="true"] { background: rgba(14,165,233,.2); border-color: rgba(56,189,248,.5); color: #bae6fd; }
  main { padding: 14px 16px 40px; }
  .note { max-width: 1536px; background: #18181b; border: 1px solid #27272a; border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; }
  .note h2 { margin: 0 0 4px; font-size: 14px; color: #f4f4f5; }
  .note p { margin: 4px 0; }
  .note b { color: #f4f4f5; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; margin-right: 6px; }
  .real { background: rgba(52,211,153,.15); color: #6ee7b7; }
  .draw { background: rgba(251,191,36,.15); color: #fcd34d; }
  .shot { overflow-x: auto; }
  .shot img { display: block; width: 1536px; height: 700px; border: 1px solid #27272a; }
  .grid { display: grid; grid-template-columns: repeat(2, 500px); gap: 12px; }
  .grid figure { margin: 0; }
  .grid img { display: block; width: 500px; height: 281px; border: 1px solid #27272a; }
  .grid figcaption { font-size: 12px; color: #a1a1aa; padding-top: 3px; }
  .hint { color: #71717a; font-size: 12px; margin-top: 6px; }
  table { border-collapse: collapse; font-size: 13px; margin: 6px 0; }
  td, th { border: 1px solid #27272a; padding: 3px 10px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
</style>
</head>
<body>
<header>
  <h1>F7 시안 — 장면 탐색 <small>2026-11-26 14:10 KST · 1536×700(사용자 노트북 창 크기) · 실제 앱 위에 그린 그림</small></h1>
  <nav id="nav"></nav>
</header>
<main>
  <div class="note" id="note"></div>
  <div id="view"></div>
  <p class="hint">← → 또는 숫자키로 넘긴다. 그림은 실제 크기(1:1)다. <span class="tag real">실제</span>는 앱이 지금 그리는 것, <span class="tag draw">그림</span>은 제안하는 UI를 화면 위에 그려 넣은 것이다(아직 코드가 아니다).</p>
</main>
<script>
const DIR = '2026-11-26_mockups/';
const SCREENS = [
  {
    key: '지금 방식 그대로',
    title: '0. 지금 방식에 프레임 41개(장면 하나 전체)를 넣으면',
    img: 'm0_asis_41frames.jpg',
    html: `<p><span class="tag real">실제</span>코드는 그대로 두고 데이터만 scene-0916의 키프레임 41개로 바꿔 끼운 화면이다.</p>
      <p><b>무엇을 보면 되는지:</b> 아래 타임라인. 썸네일 41개 중 <b>12개만 보이고</b> 나머지는 가로로 밀어야 나온다. 장면이 10개가 되면 지금 어느 장면인지, 다른 장면으로 어떻게 가는지를 보여 줄 자리도 없다.</p>`,
  },
  {
    key: '타임라인',
    title: '1. 장면 고르기 + 눈금 막대 타임라인 (추천안)',
    img: 'm1_timeline_scrubber.jpg',
    html: `<p><span class="tag draw">그림</span>아래 타임라인 한 줄만 새로 그렸다. 위쪽은 실제 화면이다.</p>
      <p><b>무엇을 보면 되는지:</b> ① 왼쪽의 <b>SCENE scene-0916 ▾ 7 / 10</b>: 지금 장면과, 장면을 바꾸는 자리. ② 오른쪽의 <b>칸 41개</b>: 프레임 하나가 칸 하나라서 장면 전체가 스크롤 없이 한눈에 들어온다. 막대 높이는 그 프레임의 박스 수, 초록은 검수한 만큼(초록 부분은 예시 값이다). ③ 27번 칸 위의 <b>작은 사진</b>: 칸에 마우스를 올리면 그 프레임의 사진과 숫자가 뜬다.</p>
      <p><b>대가:</b> 썸네일이 항상 보이지는 않는다(마우스를 올려야 보인다). 대신 프레임이 41개든 100개든 한 줄에 들어간다.</p>`,
  },
  {
    key: '장면 목록',
    title: '2. 장면 목록을 펼친 모습',
    img: 'm2_scene_menu.jpg',
    html: `<p><span class="tag draw">그림</span>장면 이름을 누르면 위로 펼쳐지는 목록이다. 숫자(프레임 수, 박스 수)와 설명 글은 <b>nuScenes-mini 원본에서 읽은 실제 값</b>이다.</p>
      <p><b>무엇을 보면 되는지:</b> 장면 10개가 한 화면에 들어온다. 데이터셋이 적어 둔 영어 설명("Night, after rain, many peds…")이 그대로 보여서 어떤 장면인지 고르기 쉽다. day / night 표시는 설명 글이 "Night"로 시작하는지로 정한다. 오른쪽 끝 칸은 검수 모드에서는 검수 진행, 평가 모드에서는 그 장면의 Recall을 보여 줄 자리다.</p>`,
  },
  {
    key: '조건 검색 (보행자)',
    title: '3. Explore 모드 — "보행자가 20m 안에 5명 이상"',
    img: 'm3_explore_people.jpg',
    html: `<p><span class="tag draw">그림</span>모드 버튼, 조건 줄, 왼쪽 결과 목록, 오른쪽 아래 요약, 타임라인을 그렸다. 3D와 사진은 실제 화면이다(3D는 조건에 든 박스만 색을 남기고 나머지를 회색으로 바꿔 찍었다). <b>숫자는 전부 실제 데이터로 계산한 값이다</b>(404개 중 177개 프레임, 장면 7곳).</p>
      <p><b>무엇을 보면 되는지:</b> ① 상단의 <b>Explore | Review | Evaluate</b>: 세 번째 모드가 생긴다. ② 그 아래 <b>FIND FRAMES WHERE</b>: 조건을 칩으로 쌓는다. 자주 쓰는 조건은 Presets 한 번으로 건다. ③ 왼쪽 <b>RESULTS 177</b>: 조건에 맞는 프레임이 장면별로 묶여 나온다. 줄을 누르면 그 장면의 그 프레임이 열린다(장면이 달라도 3D 캔버스는 다시 만들지 않는다). ④ 3D에서 <b>초록 박스 20개</b>가 "20m 안의 보행자"다. 왜 이 프레임이 걸렸는지가 바로 보인다. ⑤ 오른쪽 아래: 장면마다 몇 프레임이 맞는지. ⑥ 타임라인: 이 장면에서 조건에 맞는 프레임만 노란색이다.</p>
      <p><b>그다음:</b> 찾은 프레임에서 Review나 Evaluate로 바꾸면 그 프레임 그대로 검수하거나 채점 결과를 본다.</p>`,
  },
  {
    key: '조건 검색 (모델이 놓친 장면)',
    title: '4. Explore 모드 — "모델이 15개 이상 놓친 프레임"',
    img: 'm4_explore_model_missed.jpg',
    html: `<p><span class="tag draw">그림</span>모드 버튼, 조건 줄, 결과 목록, 요약, 타임라인을 그렸다. 3D의 결과 색, 사진 위의 정답(점선)과 모델(실선) 박스, 카메라 썸네일의 숫자는 <b>실제 앱이 YOLO 예측으로 그린 것</b>이다(scene-1094, 밤 장면). 숫자는 전부 실제 채점 결과다(404개 중 135개 프레임).</p>
      <p><b>무엇을 보면 되는지:</b> ① 결과가 <b>많이 놓친 순서</b>로 나온다. 위쪽이 거의 다 <b>scene-1094(밤, 비 온 뒤)</b>다. ② 오른쪽 아래 막대: 밤 장면(1077, 1094, 1100)과 공사 구간(0061)에 몰려 있고, 주차장과 낮의 한산한 길(0655, 0757, 0796)은 0이다. ③ 3D의 빨간 박스가 어느 카메라도 찾지 못한 물체다. "모델이 틀리는 장면을 모아 본다"가 이 화면이다.</p>
      <p><b>주의:</b> 장면 10개로 늘린 뒤의 숫자다. 이 숫자를 포트폴리오에 어떻게 쓸지는 설계 문서 9장에서 따로 묻는다.</p>`,
  },
  {
    key: '사진을 줄이면',
    title: '5. 사진을 줄였을 때 카메라 칸이 어떻게 보이는지',
    grid: [
      ['m5_zoom_far_orig.png', '확대 · 원본 1600×900 JPEG (지금) — 사진 1장 평균 174KB, 전체 2,424장 432MB'],
      ['m5_zoom_far_w1280.png', '확대 · 1280×720 WebP — 평균 63KB, 전체 155MB'],
      ['m5_zoom_far_w960.png', '확대 · 960×540 WebP (추천) — 평균 42KB, 전체 103MB'],
      ['m5_zoom_far_w800.png', '확대 · 800×450 WebP — 평균 33KB, 전체 82MB'],
      ['m5_full_orig.png', '전체 보기 · 원본'],
      ['m5_full_w1280.png', '전체 보기 · 1280×720'],
      ['m5_full_w960.png', '전체 보기 · 960×540'],
      ['m5_full_w800.png', '전체 보기 · 800×450'],
    ],
    html: `<p><span class="tag real">실제</span>실제 앱의 카메라 칸을 그대로 찍었다(화면 배율 125% 기준 500×281픽셀). 사진 파일만 크기를 줄인 것으로 바꿔 끼웠다. 고른 박스는 앞 카메라에서 가장 먼 보행자(27m)다.</p>
      <p><b>무엇을 보면 되는지:</b> 위 네 장(확대)에서 <b>흰 박스 안의 사람이 사람으로 보이는지</b>. 먼 물체를 확대한 화면이 사진 크기에 가장 민감하다. 원본도 이미 크게 늘려 보여 주는 것이라 흐리고, 줄일수록 조금씩 더 흐려진다. 아래 네 장(전체 보기)은 차이가 거의 없다.</p>
      <p><b>왜 줄여야 하는지:</b> 원본 그대로면 사진만 432MB다(지금 저장소 전체가 53MB). 박스 좌표와 모델 예측은 원본 사진 기준 그대로 두고, <b>화면에 보여 주는 사진만</b> 줄인다. 그래서 채점 숫자는 바뀌지 않는다.</p>`,
  },
];
let at = 0;
const nav = document.getElementById('nav');
const note = document.getElementById('note');
const view = document.getElementById('view');
function show(i) {
  at = (i + SCREENS.length) % SCREENS.length;
  const s = SCREENS[at];
  nav.innerHTML = SCREENS.map((x, k) => `<button aria-pressed="${k === at}" data-k="${k}">${k + 1}. ${x.key}</button>`).join('');
  note.innerHTML = `<h2>${s.title}</h2>${s.html}`;
  view.innerHTML = s.grid
    ? `<div class="grid">${s.grid.map(([f, c]) => `<figure><img src="${DIR}${f}" alt=""><figcaption>${c}</figcaption></figure>`).join('')}</div>`
    : `<div class="shot"><img src="${DIR}${s.img}" alt=""></div>`;
  try { history.replaceState(null, '', `#${at + 1}`); } catch (e) { /* 파일로 열었을 때 무시 */ }
}
nav.addEventListener('click', (e) => { const k = e.target?.dataset?.k; if (k !== undefined) show(Number(k)); });
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') show(at + 1);
  else if (e.key === 'ArrowLeft') show(at - 1);
  else if (/^[1-9]$/.test(e.key) && Number(e.key) <= SCREENS.length) show(Number(e.key) - 1);
});
show(Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
</script>
</body>
</html>
