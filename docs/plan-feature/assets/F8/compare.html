let at = 0;
const nav = document.getElementById('nav');
const note = document.getElementById('note');
const view = document.getElementById('view');
function show(i) {
  at = (i + SCREENS.length) % SCREENS.length;
  const s = SCREENS[at];
  nav.innerHTML = SCREENS.map((x, k) => `<button aria-pressed="${k === at}" data-k="${k}">${k + 1}. ${x.key}</button>`).join('');
  note.innerHTML = `<h2>${s.title}</h2>${s.html}`;
  view.innerHTML = `<div class="shot"><img src="${DIR}${s.img}" width="${s.w}" height="${s.h}" style="width:${s.w}px;height:${s.h}px" alt=""></div>`;
  try { history.replaceState(null, '', `#${at + 1}`); } catch (e) { /* 파일로 열었을 때 무시 */ }
}
nav.addEventListener('click', (e) => { const k = e.target?.dataset?.k; if (k !== undefined) show(Number(k)); });
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') show(at + 1);
  else if (e.key === 'ArrowLeft') show(at - 1);
  else if (/^[1-9]$/.test(e.key) && Number(e.key) <= SCREENS.length) show(Number(e.key) - 1);
});
show(Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
</script>
