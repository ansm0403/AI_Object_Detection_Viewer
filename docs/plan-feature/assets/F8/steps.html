      <p><b>등장 움직임 (④ 목록의 그 줄에서 커짐, 0.32초):</b> 이 화면에서 쟀다. 누른 지 0.09초 뒤에 화면이 실제로 커지는 중이고(크기 0~1 사이), <b>커지는 시작점이 목록에서 고른 줄의 자리와 같다.</b> 움직임은 0.32초에 끝난다. 키를 누른 순간부터 끝날 때까지는 페이지 안에서 잰 값으로 383ms였다(박스 156개, 소프트웨어 렌더링, 한 번 잰 참고값). 운영체제의 "움직임 줄이기"를 켜면 움직임 없이 바로 나온다.</p>
      <p>이 움직임은 그림으로 볼 수 없으니 직접 눌러 봐야 한다.</p>`,
  },
];
let at = 0;
const nav = document.getElementById('nav');
const note = document.getElementById('note');
const view = document.getElementById('view');
function show(i) {
  at = (i + SCREENS.length) % SCREENS.length;
  const s = SCREENS[at];
  nav.innerHTML = SCREENS.map((x, k) => `<button aria-pressed="${k === at}" data-k="${k}">${k + 1}. ${x.key}</button>`).join('');
  note.innerHTML = `<h2>${s.title}</h2>${s.html}`;
  view.innerHTML = s.img ? `<div class="shot"><img src="${DIR}${s.img}" width="${s.w}" height="${s.h}" style="width:${s.w}px;height:${s.h}px" alt=""></div>` : '';
  try { history.replaceState(null, '', `#${at + 1}`); } catch (e) { /* 파일로 열었을 때 무시 */ }
}
nav.addEventListener('click', (e) => { const k = e.target?.dataset?.k; if (k !== undefined) show(Number(k)); });
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') show(at + 1);
  else if (e.key === 'ArrowLeft') show(at - 1);
});
show(Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
</script>
