<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>F4 시안 비교</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #050506; color: #e4e4e7;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  .bar { position: sticky; top: 0; z-index: 5; background: #111113; border-bottom: 1px solid #27272a; padding: 10px 16px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .row + .row { margin-top: 8px; }
  .lbl { font-size: 12px; color: #71717a; width: 64px; }
  button { font: inherit; font-size: 13px; color: #d4d4d8; background: #1f1f23; border: 1px solid #3f3f46;
    border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: #71717a; }
  button.on { background: #0c4a6e; border-color: #38bdf8; color: #e0f2fe; }
  button.before.on { background: #3f3f46; border-color: #a1a1aa; color: #fff; }
  button:disabled { opacity: .3; cursor: default; }
  kbd { font: 600 11px ui-monospace, monospace; border: 1px solid #52525b; border-radius: 3px; padding: 0 4px; color: #a1a1aa; }
  .note { margin: 10px 0 0; font-size: 14px; line-height: 1.55; color: #d4d4d8; max-width: 1100px; }
  .note b { color: #fff; }
  .hint { font-size: 12px; color: #71717a; margin-left: 10px; }
  .stage { padding: 16px; overflow-x: auto; }
  .tag { display: inline-block; margin-bottom: 8px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
  .tag.mock { background: #0c4a6e; color: #bae6fd; }
  .tag.now { background: #3f3f46; color: #fff; }
  img { display: block; border: 1px solid #27272a; cursor: pointer; }
</style>
</head>
<body>
<div class="bar">
  <div class="row"><span class="lbl">창 크기</span><span id="sizes"></span>
    <span class="hint">사용자 노트북 창은 약 1536×700 · 이미지는 실제 크기(1:1)</span></div>
  <div class="row"><span class="lbl">화면</span><button id="before" class="before">지금 (F3 완료 화면) <kbd>B</kbd></button><span id="states"></span>
    <span class="hint">이미지를 클릭하거나 <kbd>Space</kbd>를 누르면 지금 ↔ 시안이 같은 자리에서 바뀝니다</span></div>
  <p class="note" id="note"></p>
</div>
<div class="stage">
  <span class="tag" id="tag"></span>
  <img id="img" alt="" />
</div>
<script>
const SIZES = ['1536x700', '1280x720'];
// key, 버튼 이름, 지금 화면 파일 접미사, 설명
const STATES = [
  { k: 'A_unreviewed_zoom', name: 'A 검수 전 · 카메라 확대', before: 'incam',
    note: '<b>기본 검수 화면.</b> 보행자(28m)를 선택한 상태입니다. ① 오른쪽 아래 패널 맨 위에 <b>승인 / 반려 / 판단 불가(Unsure) 버튼</b>이 스크롤 밖에 고정됩니다. ② 목록 행에 <b>LiDAR 근거 막대</b>(주황 = 박스 안 점이 4개 이하)와 <b>검수 상태 아이콘</b>(✓ 승인, ✕ 반려, ? 판단 불가, ○ 미검수)이 붙습니다. ③ 상단에 <b>전체 진행률과 Export</b>, 타임라인 배지는 "검수한 수/전체"로 바뀝니다. ④ 카메라 칸은 선택한 박스 주변을 <b>확대</b>하고, 2D 사각형 대신 <b>3D 박스를 사진에 투영한 선</b>(하늘색 = 앞면)을 그립니다.' },
  { k: 'B_unreviewed_full', name: 'B 같은 상태 · 카메라 전체', before: 'incam',
    note: 'A와 같은 상태에서 카메라만 <b>전체 보기</b>로 둔 화면입니다. A와 번갈아 보면 확대가 왜 필요한지 보입니다. 전체 보기에서 보행자 박스는 약 14×25px입니다. (1536×700에서만 준비했습니다.)' },
  { k: 'C_rejected_zoom', name: 'C 반려 + 사유', before: 'incam',
    note: '<b>반려한 직후.</b> 반려하면 사유 칩 6개(숫자키 1~6)와 메모 칸이 나타납니다. 이때 버튼 영역이 커져서 아래 "Selected" 정보는 패널 안에서 스크롤됩니다. 1536×700에서 얼마나 좁아지는지 확인해 주세요.' },
  { k: 'D_outcam_approved_sorted', name: 'D 카메라 밖 · 근거 약한 순', before: 'outcam',
    note: '<b>카메라에 안 보이는 박스</b>(차, 21m)를 승인한 상태입니다. 카메라 칸에는 "CAM_FRONT 밖 · 3D에서 확인" 안내가 뜹니다. 목록은 <b>LiDAR 점이 적은 순</b>으로 정렬했습니다(목록 제목 아래 Order). 지금 화면과는 선택한 박스가 다릅니다. (1536×700에서만 준비했습니다.)' },
  { k: 'E_practice', name: 'E 연습 모드', before: 'incam',
    note: '<b>연습 모드를 켠 화면.</b> 상단 배지가 "Measured" 대신 주황색 <b>"Practice · labels modified"</b>로, 3D 이름표도 "boxes modified (practice)"로 바뀝니다. 패널에 <b>채점 칸</b>(심어 둔 오류 중 몇 개를 찾았나)이 생깁니다. 숫자는 예시입니다.' },
  { k: 'F_car_frame9_zoom', name: 'F 차량 · 확대 (프레임 9)', before: 'frame9_car',
    note: '<b>차량에서 본 카메라 확대.</b> 프레임 9의 차(28m)입니다. 투영한 3D 박스가 차를 감싸는지, 앞면(하늘색)이 차의 앞뒤 방향과 맞는지 볼 수 있습니다. 사진 원본이 1600×900이라 이 거리에서는 이 정도 선명도가 한계입니다.' },
  { k: 'G_car_frame9_full', name: 'G 차량 · 전체 (프레임 9)', before: 'frame9_car',
    note: 'F와 같은 차를 카메라 <b>전체 보기</b>로 본 화면입니다. F와 번갈아 보세요. (1536×700에서만 준비했습니다.)' },
];
// 저장소 용량 때문에 일부 조합만 남겼다.
const HAVE = {
  '1536x700': ['A', 'B', 'C', 'D', 'E', 'F', 'G'],
  '1280x720': ['A', 'C'],
};
const HAVE_BEFORE = {
  '1536x700': ['incam', 'outcam', 'frame9_car'],
  '1280x720': ['incam'],
};
let size = SIZES[0], state = STATES[0], showBefore = false;
const $ = (id) => document.getElementById(id);
const has = (s, sz) => HAVE[sz].includes(s.k[0]);

function render() {
  $('sizes').innerHTML = '';
  SIZES.forEach((sz) => {
    const b = document.createElement('button');
    b.textContent = sz.replace('x', '×'); b.className = sz === size ? 'on' : '';
    b.onclick = () => { size = sz; if (!has(state, size)) state = STATES[0]; render(); };
    $('sizes').appendChild(b); $('sizes').append(' ');
  });
  $('states').innerHTML = '';
  STATES.forEach((s, i) => {
    const b = document.createElement('button');
    b.innerHTML = `${s.name} <kbd>${i + 1}</kbd>`; b.className = !showBefore && s === state ? 'on' : '';
    b.disabled = !has(s, size);
    b.onclick = () => { state = s; showBefore = false; render(); };
    $('states').append(' '); $('states').appendChild(b);
  });
  const beforeOk = HAVE_BEFORE[size].includes(state.before);
  $('before').className = 'before' + (showBefore ? ' on' : '');
  $('before').disabled = !beforeOk;
  if (showBefore && !beforeOk) showBefore = false;
  $('img').src = showBefore
    ? `2026-11-25_before/nuscenes_${size}_${state.before}.jpg`
    : `2026-11-25_mockup/${state.k}_${size}.jpg`;
  $('tag').textContent = showBefore ? '지금 (F3 완료 화면)' : `시안 ${state.name}`;
  $('tag').className = 'tag ' + (showBefore ? 'now' : 'mock');
  $('note').innerHTML = state.note;
}
const flip = () => { showBefore = !showBefore; render(); };
$('before').onclick = flip;
$('img').onclick = flip;
addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'b' || e.key === 'B') { e.preventDefault(); flip(); return; }
  const n = Number(e.key);
  if (n >= 1 && n <= STATES.length && has(STATES[n - 1], size)) { state = STATES[n - 1]; showBefore = false; render(); }
});
render();
</script>
</body>
</html>
