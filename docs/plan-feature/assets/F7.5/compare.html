<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>F7.5 시안 — 평가 결과를 믿을 수 있게</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #09090b; color: #d4d4d8; font: 14px/1.6 system-ui, "Malgun Gothic", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: #18181b; border-bottom: 1px solid #27272a; padding: 10px 16px; }
  h1 { margin: 0 0 8px; font-size: 15px; color: #f4f4f5; }
  h1 small { font-weight: 400; color: #71717a; margin-left: 8px; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  nav button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 1px solid #3f3f46; background: #27272a; color: #d4d4d8; cursor: pointer; }
  nav button[aria-pressed="true"] { background: rgba(14,165,233,.2); border-color: rgba(56,189,248,.5); color: #bae6fd; }
  main { padding: 14px 16px 40px; }
  .note { max-width: 1536px; background: #18181b; border: 1px solid #27272a; border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; }
  .note h2 { margin: 0 0 4px; font-size: 14px; color: #f4f4f5; }
  .note p { margin: 4px 0; }
  .note b { color: #f4f4f5; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; margin-right: 6px; }
  .real { background: rgba(52,211,153,.15); color: #6ee7b7; }
  .draw { background: rgba(251,191,36,.15); color: #fcd34d; }
  .ask { background: rgba(56,189,248,.15); color: #7dd3fc; }
  .shot { overflow-x: auto; }
  .shot img { display: block; border: 1px solid #27272a; }
  .hint { color: #71717a; font-size: 12px; margin-top: 6px; }
  table { border-collapse: collapse; font-size: 13px; margin: 6px 0; }
  td, th { border: 1px solid #27272a; padding: 3px 10px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
</style>
</head>
<body>
<header>
  <h1>F7.5 시안 — 평가 결과를 믿을 수 있게 <small>2026-11-27 06:20 KST · 1536×700(사용자 노트북 창 크기) · 실제 앱(개발 서버 3100번) 위에 그린 그림</small></h1>
  <nav id="nav"></nav>
</header>
<main>
  <div class="note" id="note"></div>
  <div id="view"></div>
  <p class="hint">← → 또는 숫자키로 넘긴다. 그림은 실제 크기(1:1)다. <span class="tag real">실제</span>는 앱이 지금 그리는 것, <span class="tag draw">그림</span>은 제안하는 UI를 화면 위에 그려 넣은 것이다(아직 코드가 아니다). <span class="tag ask">정할 것</span>은 먼저 골라 줘야 하는 것이다.</p>
</main>
<script>
const DIR = '2026-11-27_mockups/';
const SCREENS = [
  {
    key: '지금',
    title: '1. 지금의 평가 모드',
    img: 'm1_now_evaluate.jpg', w: 1536, h: 700,
    html: `<p><span class="tag real">실제</span>아무것도 그려 넣지 않은 지금 화면이다. 비교의 기준이다.</p>
      <p><b>무엇을 보면 되는지:</b> ① 위쪽 줄에는 점수 기준(Min score)만 있고 <b>겹침 기준(IoU)을 고르는 곳이 없다.</b> ② 오른쪽 아래 Evaluation 패널에 <b>"입력 크기 1280"과 "추가 학습 없음"이 없다.</b> ③ 이 패널의 높이는 232px라서 "All scenes"는 제목만 보이고 내용은 스크롤해야 나온다.</p>`,
  },
  {
    key: '조건 한 줄 + IoU',
    title: '2. 조건 한 줄과 IoU 기준 고르기 (범위 ②, ⑤)',
    img: 'm2_conditions_iou.jpg', w: 1536, h: 700,
    html: `<p><span class="tag draw">그림</span>위쪽 줄의 <b>MIN OVERLAP (IoU) [0.3 | 0.5]</b>, 그리고 패널의 <b>"YOLOv8n · no fine-tuning · input 1280 · score ≥ 0.25 · IoU ≥ 0.3"</b> 한 줄을 그려 넣었다.</p>
      <p><b>쉬운 말로:</b> IoU는 "모델의 박스와 정답 박스가 얼마나 겹치는가"(0~1)다. 0.3이면 "30% 이상 겹치면 찾은 것으로 친다"는 뜻이다. 표준은 0.5인데, 이 도구의 정답 박스는 3D 박스를 사진에 비춘 것이라 물체보다 헐거워서 0.3을 기본으로 쓴다.</p>
      <p><b>무엇을 보면 되는지:</b> 기본값은 0.3 그대로라 숫자가 1번 화면과 같다(Precision 77%, Recall 68%). 조건 한 줄이 들어가면서 패널의 내용이 20px쯤 아래로 밀렸다.</p>`,
  },
  {
    key: 'IoU 0.5',
    title: '3. IoU 0.5를 골랐을 때 (숫자는 실제)',
    img: 'm3_iou05.jpg', w: 1536, h: 700,
    html: `<p><span class="tag real">실제</span>이 화면의 숫자, 목록, 3D 색, 타임라인은 <b>앱의 기준값을 잠깐 0.5로 바꿔서 실제로 계산한 것</b>이다(찍은 뒤 되돌렸다). <span class="tag draw">그림</span>은 위쪽 줄의 고르기 버튼과 조건 한 줄뿐이다.</p>
      <p><b>무엇을 보면 되는지:</b> 같은 장면이 Precision 77% → <b>57%</b>, Recall 68% → <b>54%</b>가 된다. 첫 프레임은 놓침 23 → 28, 헛짚음 5 → 11. <b>기준 하나로 숫자가 이만큼 움직인다는 것</b>을 글이 아니라 화면에서 보게 된다.</p>
      <p><b>F7 때 조사한 값과 같은지 확인했다:</b> 전체 장면 Precision 51.1% / Recall 45.4%, 낮 52.3%(4,659 / 8,916) / 밤 25.9%(803 / 3,102). F7 설계 문서의 51% / 45%, 52% / 26%와 같다.</p>
      <p>Explore의 검색과 표본 검수는 이 버튼의 영향을 받지 않는다(고정 규칙으로 계산한다).</p>`,
  },
  {
    key: '지금: 헛짚음 하나',
    title: '4. 지금: "근처에 정답 없는 헛짚음" 하나를 골랐을 때',
    img: 'm4_now_false_alarm.jpg', w: 1536, h: 700,
    html: `<p><span class="tag real">실제</span>scene-0916의 19번째 프레임, 앞 카메라. 모델이 "차, 점수 0.78"이라고 한 박스다. 그 자리에 nuScenes의 정답은 없다. 그래서 지금은 "헛짚음"으로 센다.</p>
      <p><b>무엇을 보면 되는지:</b> 오른쪽 위 사진. 트럭 뒤로 <b>흰 차처럼 보이는 것</b>이 박스 안에 있다. 이런 박스가 전체에 <b>1,452개</b>(헛짚음 3,514개의 41%) 있고, 모델이 틀린 것인지 정답이 빠진 것인지 아무도 확인하지 않았다. 지금은 이런 박스를 하나씩 찾아가 볼 수는 있어도 <b>판정을 남길 곳이 없다.</b></p>`,
  },
  {
    key: '표본 검수',
    title: '5. 표본 검수 화면 (범위 ①)',
    img: 'm5_sample_check.jpg', w: 1536, h: 700,
    html: `<p><span class="tag draw">그림</span>위쪽 줄, 왼쪽 목록, 오른쪽 아래 패널을 그려 넣었다. 3D 화면과 사진은 4번 화면 그대로다. <b>판정 숫자(5 / 5 / 2)는 그림을 위한 예시</b>다. 판정은 네가 한다.</p>
      <p><b>흐름:</b> 평가 모드에서 "Check a sample"을 누르면 이 화면이 된다. 1,452개에서 <b>무작위로 뽑은 100개</b>가 왼쪽에 순서대로 나온다(다시 열어도 같은 100개, 같은 순서). 사진이 그 박스로 자동 확대된다. <b>A</b> = 진짜 물체인데 정답이 빠짐, <b>R</b> = 모델이 틀림, <b>U</b> = 애매함. 누르면 다음 박스로 넘어간다(장면이 바뀌어도 따라간다). F4 검수와 같은 키, 같은 저장 방식이다.</p>
      <p><b>무엇을 보면 되는지:</b> ① 오른쪽 아래 "ESTIMATE SO FAR": 결과는 항상 <b>"12개 중 5개"처럼 표본 크기와 함께</b> 나오고, "전체 1,452개 중 대략 19~68%"라는 <b>범위</b>로 적힌다. 12개만 봤을 때는 범위가 이렇게 넓다. 100개를 보면 ±9%p쯤으로 좁아진다. ② 위쪽 줄의 "Sample size 100 / 200 / 300": 100개를 다 본 뒤 더 보고 싶으면 늘릴 수 있고, 앞의 100개 판정은 그대로 남는다.</p>
      <p><span class="tag ask">정할 것</span>표본을 몇 개로 시작할지(추천: 100개, 약 15분).</p>`,
  },
  {
    key: '배치 A: 패널 안',
    title: '6. 배치 A — 주행 단위 표와 거리별 낮/밤을 지금 패널 안에 (범위 ③, ④)',
    img: 'm6_option_a_panel.jpg', w: 1536, h: 700,
    html: `<p><span class="tag draw">그림</span>Evaluation 패널의 "All scenes"에 <b>Scenes | Drives</b> 전환, 주행 단위 표 8줄, 거리별 낮/밤 표, "헛짚음 1,452개는 확인 안 됨" 한 줄을 넣었다. 패널을 "All scenes"까지 스크롤한 상태다.</p>
      <p><b>무엇을 보면 되는지:</b> 네 노트북 창 크기(1536×700)에서는 패널이 232px라 <b>표가 두 줄만 보인다.</b> 나머지는 이 작은 칸 안에서 스크롤해야 한다. 만들 것은 가장 적다.</p>`,
  },
  {
    key: 'A를 큰 창에서',
    title: '7. 배치 A를 큰 창(1440×900)에서 보면',
    img: 'm6b_option_a_panel_1440x900.jpg', w: 1440, h: 900,
    html: `<p><span class="tag draw">그림</span>6번과 같은 것을 세로가 긴 창에서 찍었다. 패널이 432px라 주행 단위 표 8줄이 다 보인다. 거리별 낮/밤 표는 여전히 그 아래로 스크롤해야 한다.</p>
      <p><b>주행 단위 표 읽는 법:</b> 한 줄이 주행 한 번이다. 날짜와 장소, 고유 물체 수(obj.), Recall. 맨 아래 노란 줄이 밤 주행 하나(장면 3개)다. 낮은 주행 7번인데 밤은 주행 1번이라는 것이 표 모양으로 보인다.</p>`,
  },
  {
    key: '배치 B: 보고서 창',
    title: '8. 배치 B — 보고서 창을 따로 연다 (추천)',
    img: 'm7_option_b_report.jpg', w: 1536, h: 700,
    html: `<p><span class="tag draw">그림</span>패널의 "All scenes"에서 버튼을 누르면 목록과 3D 화면 자리 위에 <b>보고서 창</b>이 뜬다(Esc로 닫는다. 3D 화면은 밑에 그대로 있고 다시 만들지 않는다). 숫자는 모두 앱의 채점 코드로 실제 데이터를 계산한 값이다.</p>
      <p><b>무엇을 보면 되는지:</b></p>
      <p>① 맨 위 <b>조건 줄</b>: YOLOv8n, 추가 학습 없음, 입력 1280, 점수 0.25, IoU 0.3, 3D 정답을 투영한 기준. 숫자보다 먼저 읽힌다.</p>
      <p>② 가운데 <b>주행 단위 표(8줄)</b>: 물체 수와 Recall. 서로 독립인 것은 프레임 404개가 아니라 주행 8번이고, 정답 12,018개는 <b>서로 다른 물체 654개</b>가 되풀이해 찍힌 것이다.</p>
      <p>③ 오른쪽 <b>같은 거리끼리의 낮/밤</b>: 0~50m의 다섯 구간 모두에서 밤이 낮다(76 : 55, 79 : 30, 69 : 38, 62 : 29, 49 : 20). 50m 밖에서는 차이가 없거나 뒤집히는 구간이 있고 정답 수가 적다. 낮과 밤은 정답의 거리 분포가 거의 같아서(둘 다 84%가 50m 안), 밤의 거리 분포를 낮과 같게 맞춰 계산해도 밤 Recall은 33% → 34%다. <b>"밤이라서가 아니라 멀어서"는 아니라는 뜻</b>이다. 그래도 "밤 = 주행 1회"와 "원인은 모른다"가 표 안에 붙어 있다.</p>
      <p>④ 왼쪽 아래 <b>"Not checked yet"</b>: 헛짚음 1,452개는 아직 아무도 보지 않았다는 것을 숫자 옆에 적고, 표본 검수로 가는 버튼을 둔다. 판정이 끝나면 이 자리에 "100개 중 N개"가 나온다.</p>
      <p><span class="tag ask">정할 것</span>배치 A(패널 안, 작게)와 B(보고서 창, 한 화면에) 중 하나. 만들 양은 B가 더 많다(창 하나).</p>`,
  },
  {
    key: '표본 박스 16개',
    title: '9. 사실 확인 — 표본으로 나올 박스는 눈으로 판정할 만한가',
    img: 'm8_sample_crops.jpg', w: 1650, h: 1986,
    html: `<p><span class="tag real">실제</span>1,452개에서 무작위로 16개를 뽑아, 검수 화면이 확대해 보여 줄 영역을 그대로 잘랐다. 박스마다 왼쪽은 <b>앱에 실린 사진(960×540)</b>, 오른쪽은 <b>원본(1600×900)</b>이다.</p>
      <p><b>무엇을 보면 되는지:</b> ① 박스가 작다(가운데 값 42×37px). 그래도 대부분 "무엇인지"는 보인다. ② 왼쪽과 오른쪽의 차이가 거의 없다. 그래서 <b>원본 사진을 따로 싣지 않고 지금 사진으로 판정</b>하게 한다. ③ 애매한 것도 있다(#5, #6). 그래서 "애매함" 판정이 필요하다.</p>
      <p>이 16개는 화면 설계를 위한 조사다. <b>내가 판정한 것이 아니고, 결과에 넣지도 않는다.</b></p>`,
  },
];
let at = 0;
const nav = document.getElementById('nav');
const note = document.getElementById('note');
const view = document.getElementById('view');
function show(i) {
  at = (i + SCREENS.length) % SCREENS.length;
  const s = SCREENS[at];
  nav.innerHTML = SCREENS.map((x, k) => `<button aria-pressed="${k === at}" data-k="${k}">${k + 1}. ${x.key}</button>`).join('');
  note.innerHTML = `<h2>${s.title}</h2>${s.html}`;
  view.innerHTML = `<div class="shot"><img src="${DIR}${s.img}" width="${s.w}" height="${s.h}" style="width:${s.w}px;height:${s.h}px" alt=""></div>`;
  try { history.replaceState(null, '', `#${at + 1}`); } catch (e) { /* 파일로 열었을 때 무시 */ }
}
nav.addEventListener('click', (e) => { const k = e.target?.dataset?.k; if (k !== undefined) show(Number(k)); });
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') show(at + 1);
  else if (e.key === 'ArrowLeft') show(at - 1);
  else if (/^[1-9]$/.test(e.key) && Number(e.key) <= SCREENS.length) show(Number(e.key) - 1);
});
show(Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
</script>
</body>
</html>
