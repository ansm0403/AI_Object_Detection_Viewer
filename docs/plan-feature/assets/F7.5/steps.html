<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>F7.5 단계별 확인</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #09090b; color: #d4d4d8; font: 14px/1.6 system-ui, "Malgun Gothic", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: #18181b; border-bottom: 1px solid #27272a; padding: 10px 16px; }
  h1 { margin: 0 0 8px; font-size: 15px; color: #f4f4f5; }
  h1 small { font-weight: 400; color: #71717a; margin-left: 8px; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  nav button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 1px solid #3f3f46; background: #27272a; color: #d4d4d8; cursor: pointer; }
  nav button[aria-pressed="true"] { background: rgba(14,165,233,.2); border-color: rgba(56,189,248,.5); color: #bae6fd; }
  main { padding: 14px 16px 40px; }
  .note { max-width: 1536px; background: #18181b; border: 1px solid #27272a; border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; }
  .note h2 { margin: 0 0 4px; font-size: 14px; color: #f4f4f5; }
  .note p { margin: 4px 0; }
  .note b { color: #f4f4f5; }
  .note ul { margin: 4px 0; padding-left: 20px; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; margin-right: 6px; }
  .pass { background: rgba(52,211,153,.15); color: #6ee7b7; }
  .fix { background: rgba(251,191,36,.15); color: #fcd34d; }
  .shot { overflow-x: auto; }
  .shot img { display: block; border: 1px solid #27272a; }
  pre { max-width: 1536px; margin: 0 0 12px; padding: 10px 14px; background: #0f0f12; border: 1px solid #27272a; border-radius: 8px; font: 12px/1.5 ui-monospace, Consolas, monospace; color: #a1a1aa; white-space: pre-wrap; }
  .hint { color: #71717a; font-size: 12px; margin-top: 6px; }
  code { font: 12px ui-monospace, Consolas, monospace; color: #e4e4e7; }
</style>
</head>
<body>
<header>
  <h1>F7.5 단계별 확인 <small>배포용 빌드(3100번) · 실제 앱을 조작한 결과 · 캡처는 1:1 크기</small></h1>
  <nav id="nav"></nav>
</header>
<main>
  <div class="note" id="note"></div>
  <div id="view"></div>
  <p class="hint">← → 로 넘긴다. <span class="tag pass">통과</span>는 스크립트가 실제 앱을 조작해 확인한 항목 수, <span class="tag fix">고침</span>은 확인하다 찾아서 고친 것이다.</p>
</main>
<script>
const DIR = '2026-11-27_steps/';
const SCREENS = [
  {
    key: 'A 로직',
    title: '단계 A — 순수 함수와 테스트 (화면 변화 없음)',
    html: `<p><span class="tag pass">통과</span>단위 테스트 <b>861 → 977개</b>(전부 통과), 타입 오류 0, 린트 오류 0(경고 19개 그대로). 2026-11-27 07:00 KST.</p>
      <p><b>만든 것:</b> 표본 뽑기와 추정(<code>lib/sampling</code>), "근처에 정답 없는 헛짚음" 목록, 주행 단위 집계, 거리별 비교, 조건 설명(<code>lib/evaluation</code>), 검수 기록의 세 번째 구역.</p>
      <p><b>테스트가 실제 파일로 잠근 숫자</b> (바뀌면 테스트가 깨진다):</p>
      <ul>
        <li>기본 규칙의 전체 숫자는 그대로다: 6,726 / 5,292 / 3,514 / 5,278.</li>
        <li>모집단은 <b>1,452개</b>이고, IoU 0.3과 0.5에서 <b>같은 박스들</b>이다. Explore의 "근처에 정답 없는 헛짚음" 조건이 세는 수와 같다.</li>
        <li>IoU 0.5: 5,462 / 6,556 / 5,231 / 5,278 → Precision 51.1% / Recall 45.4%, 낮 52.3%, 밤 25.9%.</li>
        <li>정답 12,018개는 서로 다른 물체 <b>654개</b>(낮 483, 밤 171). 주행 8줄의 숫자.</li>
        <li>거리 구간별 낮/밤의 찾음 / 정답 10줄. 거리 분포를 맞춘 밤 Recall 33.9%(그대로는 32.7%).</li>
        <li>표본의 <b>첫 다섯 박스</b>(장면, 프레임, 예측 ID). 같은 시드는 같은 순서를 내고, 200개 표본은 100개 표본으로 시작한다.</li>
        <li>100개 중 41개 → 32.2~50.5%. 표본 100 / 200 / 300의 폭 ±9 / ±6 / ±5%p.</li>
      </ul>
      <p><b>기존 테스트에서 고친 곳 1개:</b> "검수 저장소는 빈 구역 2개로 시작한다" → 3개(구역을 하나 더했기 때문이다). 기존 두 구역의 동작과 저장된 기록은 그대로다.</p>`,
  },
  {
    key: 'B1 들어가기',
    title: '단계 B — 표본 검수: 들어가면',
    img: 'b1_enter.jpg', w: 1536, h: 700,
    html: `<p><span class="tag pass">통과</span>135 / 135. 평가 모드의 위쪽 줄 오른쪽에 생긴 <b>Sample check</b> 버튼을 누른 직후다.</p>
      <p><b>무엇을 보면 되는지:</b></p>
      <ul>
        <li><b>위쪽 줄:</b> "random 100 of 1,452". 점수 슬라이더가 없다(표본은 고정이다).</li>
        <li><b>왼쪽:</b> 표본 100개가 뽑힌 순서대로. 1번이 선택돼 있다.</li>
        <li><b>화면이 그 박스로 옮겨 갔다:</b> 1번 박스는 scene-0757의 31번째 프레임, 앞 카메라에 있다. 장면, 프레임, 사진이 자동으로 바뀌고 사진이 그 박스로 확대됐다(노란 사각형, "model · car 0.37").</li>
        <li><b>오른쪽 아래:</b> "The model says car, score 0.37 · 67×48 px"와 판정 버튼 셋. 아직 "0 of 100 judged", "Nothing judged yet — no estimate."</li>
      </ul>`,
  },
  {
    key: 'B2 판정 3개',
    title: '단계 B — A, R, U를 한 번씩 누른 뒤',
    img: 'b2_three_verdicts.jpg', w: 1536, h: 700,
    html: `<p><span class="tag pass">통과</span>키보드로 <b>A</b>(진짜 물체, 정답 빠짐) → <b>R</b>(모델이 틀림) → <b>U</b>(애매함)를 눌렀다. 누를 때마다 다음 박스로 넘어갔고, 그때마다 <b>장면이 바뀌었다</b>(0757 → 0655 → 0916 → 0061). 3D 캔버스는 다시 만들어지지 않았다.</p>
      <p><b>무엇을 보면 되는지:</b></p>
      <ul>
        <li>왼쪽 목록의 1~3번에 판정 아이콘(초록 상자, 빨간 X, 회색 물음표). 위에 개수와 "97 to go".</li>
        <li>오른쪽 아래 <b>"3 of 100 judged — not final"</b>, 그리고 <b>"1 of 3 sampled boxes → about 6–79% of all 1,452"</b>. 3개만 봤을 때의 범위는 이렇게 넓다. 결과가 항상 "N개 중 M개 + 범위"로 나오고, 전체를 센 것처럼 쓰이지 않는다.</li>
        <li>그 아래 작은 글씨: "A sample estimate, not a count of all 1,452 boxes…"</li>
      </ul>
      <p>이 세 판정은 스크립트가 누른 것이다. <b>네 브라우저에는 들어 있지 않다</b>(스크립트는 별도의 브라우저를 쓴다).</p>
      <p><span class="tag fix">고침</span>처음 찍은 화면에서는 버튼 글자가 "Real · label mi…"로 잘려 있었다. 스크립트는 통과했는데 캡처를 눈으로 보다 찾았다. 버튼 이름을 <b>Real object / Model wrong / Unclear</b>로 줄이고(풀어 쓴 이름은 툴팁과 "Judged: Real object, label missing"에), 스크립트에 <b>"말줄임 처리된 글자가 실제로 잘렸는지"(scrollWidth > clientWidth)</b> 검사를 더했다.</p>`,
  },
  {
    key: 'B3 200개',
    title: '단계 B — 표본 크기를 200으로',
    img: 'b3_size_200.jpg', w: 1536, h: 700,
    html: `<p><span class="tag pass">통과</span>위쪽 줄의 <b>200</b>을 눌렀다.</p>
      <p><b>무엇을 보면 되는지:</b> 목록이 200개가 됐고 <b>앞의 다섯 개가 그대로</b>다. 판정 3개도 그대로이고 "3 of 200 judged"로 바뀌었다. 100개를 다 본 뒤 더 보고 싶을 때 이어서 할 수 있다는 뜻이다. 다시 100을 누르면 원래대로 돌아온다.</p>`,
  },
  {
    key: 'B4 새로 고침',
    title: '단계 B — 새로 고친 뒤 다시 들어가면',
    img: 'b4_after_reload.jpg', w: 1536, h: 700,
    html: `<p><span class="tag pass">통과</span>페이지를 새로 열고 Evaluate → Sample check.</p>
      <p><b>무엇을 보면 되는지:</b> <b>같은 100개가 같은 순서</b>로 나온다. 판정 3개가 남아 있고, <b>아직 판정하지 않은 첫 박스(4번)</b>에서 다시 시작한다. 저장은 F4 검수 기록과 같은 저장소의 별도 구역(<code>nuscenes-false-alarms</code>)에 한다. 검수(Review) 모드의 진행률은 "Reviewed 0 / 604" 그대로다(서로 섞이지 않는다).</p>
      <p>함께 확인한 것: 내보내기 파일(<code>false-alarm-sample_날짜.json</code>, 형식 <code>false-alarm-sample@1</code>, 100줄, 판정은 <code>real-object / model-wrong / unclear</code>), 평가 모드의 점수 슬라이더를 0.65로 옮겨도 표본은 그대로이고 슬라이더 값도 나올 때 그대로, 재생 중에는 판정 버튼이 꺼지고 A가 듣지 않음.</p>`,
  },
  {
    key: 'B5 1280',
    title: '단계 B — 1280×720',
    img: 'b5_1280x720.jpg', w: 1280, h: 720,
    html: `<p><span class="tag pass">통과</span>글자가 잘리거나 칸 밖으로 나가는지를 <b>글자 내용이 아니라 위치로</b> 확인했다(1536×700, 1440×900, 1280×720, 1024×768 각각): 판정 버튼 셋이 패널 안에 있고 스크롤 없이 보이는가, 추정 문장이 스크롤 없이 보이는가, 목록의 열두 줄에서 잘린 칸이 없는가, 위쪽 줄에서 잘린 글자가 없는가, 페이지 스크롤이 없는가.</p>
      <p><b>무엇을 보면 되는지:</b> 위쪽 줄의 설명 글("same boxes every time…")은 1440px보다 좁으면 <b>아예 숨긴다</b>(잘린 문장을 보여 주지 않는다. 같은 내용은 "random 100 of 1,452"의 툴팁에 있다).</p>`,
  },
  {
    key: 'B6 1024',
    title: '단계 B — 1024×768 (지원하는 가장 좁은 폭)',
    img: 'b6_1024x768.jpg', w: 1024, h: 768,
    html: `<p><span class="tag pass">통과</span>가장 좁은 폭이다.</p>
      <p><span class="tag fix">고침</span>처음에는 목록의 클래스 이름이 "c…", "b…"로 잘렸다. 장면 칸을 "scene-0757"에서 <b>"0757"</b>로 줄여 고쳤다(전체 이름은 줄에 마우스를 올리면 나온다).</p>
      <p><b>무엇을 보면 되는지:</b> car / bicycle / person이 다 보인다. 판정 버튼 셋이 한 줄에 들어가 있다. 이 화면은 1번 박스를 마우스로 다시 고른 상태라 "Judged: Real object, label missing"과 "C clear"가 보인다.</p>`,
  },
];
let at = 0;
const nav = document.getElementById('nav');
const note = document.getElementById('note');
const view = document.getElementById('view');
function show(i) {
  at = (i + SCREENS.length) % SCREENS.length;
  const s = SCREENS[at];
  nav.innerHTML = SCREENS.map((x, k) => `<button aria-pressed="${k === at}" data-k="${k}">${x.key}</button>`).join('');
  note.innerHTML = `<h2>${s.title}</h2>${s.html}`;
  view.innerHTML = (s.pre ? `<pre>${s.pre}</pre>` : '') + (s.img ? `<div class="shot"><img src="${DIR}${s.img}" width="${s.w}" height="${s.h}" style="width:${s.w}px;height:${s.h}px" alt=""></div>` : '');
  try { history.replaceState(null, '', `#${at + 1}`); } catch (e) { /* 파일로 열었을 때 무시 */ }
}
nav.addEventListener('click', (e) => { const k = e.target?.dataset?.k; if (k !== undefined) show(Number(k)); });
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') show(at + 1);
  else if (e.key === 'ArrowLeft') show(at - 1);
});
show(Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
</script>
</body>
</html>
