let index = 0, showCompare = false;
const $ = (id) => document.getElementById(id);
const steps = [...new Set(SHOTS.map((s) => s.step))];

function render() {
  const shot = SHOTS[index];
  $('steps').innerHTML = '';
  steps.forEach((st) => {
    const b = document.createElement('button');
    b.textContent = `F6-${st}`; b.className = st === shot.step ? 'on' : '';
    b.onclick = () => { index = SHOTS.findIndex((s) => s.step === st); showCompare = false; render(); };
    $('steps').appendChild(b); $('steps').append(' ');
  });
  $('shots').innerHTML = '';
  SHOTS.forEach((s, i) => {
    if (s.step !== shot.step) return;
    const b = document.createElement('button');
    b.textContent = s.name; b.className = !showCompare && i === index ? 'on' : '';
    b.onclick = () => { index = i; showCompare = false; render(); };
    $('shots').appendChild(b); $('shots').append(' ');
  });
  if (!shot.compare) showCompare = false;
  $('mock').disabled = !shot.compare;
  $('mock').className = 'mock' + (showCompare ? ' on' : '');
  $('mock').firstChild.textContent = (shot.compareLabel || '시안 / 이전 화면') + ' ';
  $('img').src = showCompare ? shot.compare : shot.file;
  $('tag').textContent = showCompare ? shot.compareLabel : `실제 앱 · ${shot.name}`;
  $('tag').className = 'tag ' + (showCompare ? 'mock' : 'real');
  $('note').innerHTML = shot.note;
  $('look').innerHTML = shot.look || '';
  $('look').style.display = shot.look ? '' : 'none';
}
const flip = () => { if (SHOTS[index].compare) { showCompare = !showCompare; render(); } };
const go = (d) => { index = (index + d + SHOTS.length) % SHOTS.length; showCompare = false; render(); };
$('mock').onclick = flip;
$('img').onclick = flip;
addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
});
render();
</script>
